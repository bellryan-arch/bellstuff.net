<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --graphite: #14171D;
    --steel: #1E222B;
    --steel-line: #2C3140;
    --brass: #C9A15A;
    --brass-bright: #E4C583;
    --paper: #E9E5DA;
    --paper-dim: #8B8D93;
    --ember: #8A3B2E;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--graphite);
    overflow: hidden;
  }

  body {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* Pegboard backdrop */
  .pegboard {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--steel-line) 1px, transparent 1px);
    background-size: 34px 34px;
    background-position: 17px 17px;
    opacity: 0.55;
  }

  .pegboard::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, var(--graphite) 78%);
  }

  /* Lit pegs -- ambient, not decorative clutter, just a few */
  .peg-light {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 8px 2px rgba(201,161,90,0.55);
    animation: glow 5.5s ease-in-out infinite;
  }
  .peg-light.ember { background: var(--ember); box-shadow: 0 0 8px 2px rgba(138,59,46,0.5); }

  @keyframes glow {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.9; }
  }

  /* Plate */
  .plate-wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 72px 88px;
    background: linear-gradient(180deg, var(--steel) 0%, #191D25 100%);
    border: 1px solid var(--steel-line);
    border-radius: 4px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 40px 80px -30px rgba(0,0,0,0.7);
    overflow: hidden;
    animation: rise 1.1s cubic-bezier(.19,1,.22,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* screws at plate corners, engraved-hardware detail */
  .screw {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4A4F5C, #14171D 70%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06);
  }
  .screw::after {
    content: "";
    position: absolute;
    top: 50%; left: 15%;
    width: 70%; height: 1px;
    background: rgba(0,0,0,0.5);
    transform: rotate(35deg);
  }
  .screw.tl { top: 14px; left: 14px; }
  .screw.tr { top: 14px; right: 14px; }
  .screw.bl { bottom: 14px; left: 14px; }
  .screw.br { bottom: 14px; right: 14px; }

  /* light sweep across the plate, once */
  .sweep {
    position: absolute;
    top: 0; bottom: 0;
    width: 120px;
    background: linear-gradient(100deg, transparent, rgba(228,197,131,0.08), transparent);
    left: -160px;
    animation: sweep 2.4s ease-out 0.5s 1;
  }
  @keyframes sweep {
    to { left: 110%; }
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--paper-dim);
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--brass-bright);
    text-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  .tagline {
    margin: 20px auto 0;
    max-width: 30ch;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.55;
    color: var(--paper-dim);
  }

  .divider {
    width: 34px;
    height: 2px;
    background: var(--ember);
    margin: 30px auto 26px;
    border-radius: 2px;
  }

  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--paper-dim);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 6px 1px rgba(201,161,90,0.7);
    animation: glow 3s ease-in-out infinite;
  }

  .corner-mark {
    position: fixed;
    bottom: 22px;
    right: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: var(--paper-dim);
    opacity: 0.5;
    z-index: 2;
  }

  @media (max-width: 560px) {
    .plate-wrap { padding: 52px 34px; margin: 0 20px; }
  }
</style>
</head>
<body>

  <div class="pegboard" id="pegboard"></div>

  <div class="plate-wrap">
    <div class="sweep"></div>
    <span class="screw tl"></span>
    <span class="screw tr"></span>
    <span class="screw bl"></span>
    <span class="screw br"></span>

    <p class="eyebrow">Est. 2026 — Cambridge, ON</p>
    <h1>The Workshop</h1>
    <p class="tagline">Small tools, built by hand for the people who need them. Ask, and I'll hand you the key.</p>
    <div class="divider"></div>
    <div class="status"><span class="dot"></span>Lights are on</div>
  </div>

  <div class="corner-mark">// no public entrance</div>

<script>
  // Scatter a handful of ambient peg-lights across the board, avoiding the center plate.
  const board = document.getElementById('pegboard');
  const count = 9;
  for (let i = 0; i < count; i++) {
    const light = document.createElement('div');
    light.className = 'peg-light' + (Math.random() < 0.3 ? ' ember' : '');
    const angle = Math.random() * Math.PI * 2;
    const radius = 30 + Math.random() * 62; // percent-ish spread, kept off-center
    const x = 50 + Math.cos(angle) * radius;
    const y = 50 + Math.sin(angle) * radius;
    light.style.left = Math.min(96, Math.max(2, x)) + 'vw';
    light.style.top = Math.min(94, Math.max(4, y)) + 'vh';
    light.style.animationDelay = (Math.random() * 5) + 's';
    board.appendChild(light);
  }
</script>

</body>
</html>
