<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --graphite: #14171D;
    --steel: #1E222B;
    --steel-line: #2C3140;
    --brass: #C9A15A;
    --brass-bright: #E4C583;
    --paper: #E9E5DA;
    --paper-dim: #8B8D93;
    --ember: #8A3B2E;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--graphite);
    overflow: hidden;
  }

  body {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* Pegboard backdrop */
  .pegboard {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--steel-line) 1px, transparent 1px);
    background-size: 34px 34px;
    background-position: 17px 17px;
    opacity: 0.55;
  }

  .pegboard::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, var(--graphite) 78%);
  }

  /* Lit pegs -- ambient, not decorative clutter, just a few */
  .peg-light {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 8px 2px rgba(201,161,90,0.55);
    animation: glow 5.5s ease-in-out infinite;
  }
  .peg-light.ember { background: var(--ember); box-shadow: 0 0 8px 2px rgba(138,59,46,0.5); }

  @keyframes glow {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.9; }
  }

  /* Plate */
  .plate-wrap {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 72px 88px;
    background: linear-gradient(180deg, var(--steel) 0%, #191D25 100%);
    border: 1px solid var(--steel-line);
    border-radius: 4px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 40px 80px -30px rgba(0,0,0,0.7);
    overflow: hidden;
    animation: rise 1.1s cubic-bezier(.19,1,.22,1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* screws at plate corners, engraved-hardware detail */
  .screw {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4A4F5C, #14171D 70%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06);
  }
  .screw::after {
    content: "";
    position: absolute;
    top: 50%; left: 15%;
    width: 70%; height: 1px;
    background: rgba(0,0,0,0.5);
    transform: rotate(35deg);
  }
  .screw.tl { top: 14px; left: 14px; }
  .screw.tr { top: 14px; right: 14px; }
  .screw.bl { bottom: 14px; left: 14px; }
  .screw.br { bottom: 14px; right: 14px; }

  /* light sweep across the plate, once */
  .sweep {
    position: absolute;
    top: 0; bottom: 0;
    width: 120px;
    background: linear-gradient(100deg, transparent, rgba(228,197,131,0.08), transparent);
    left: -160px;
    animation: sweep 2.4s ease-out 0.5s 1;
  }
  @keyframes sweep {
    to { left: 110%; }
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--paper-dim);
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--brass-bright);
    text-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  .tagline {
    margin: 20px auto 0;
    max-width: 30ch;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.55;
    color: var(--paper-dim);
  }

  .divider {
    width: 34px;
    height: 2px;
    background: var(--ember);
    margin: 30px auto 26px;
    border-radius: 2px;
  }

  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--paper-dim);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 6px 1px rgba(201,161,90,0.7);
    animation: glow 3s ease-in-out infinite;
  }

  .corner-mark {
    position: fixed;
    bottom: 22px;
    right: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: var(--paper-dim);
    opacity: 0.5;
    z-index: 2;
  }

  @media (max-width: 560px) {
    .plate-wrap { padding: 52px 34px; margin: 0 20px; }
  }

  /* Hanging tool tags */
  .tags {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 42px;
    margin-top: 46px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .tag {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    animation: swing-in 0.9s cubic-bezier(.19,1,.22,1) both;
  }
  .tag:nth-child(1) { animation-delay: 0.35s; }
  .tag:nth-child(2) { animation-delay: 0.5s; }
  .tag:nth-child(3) { animation-delay: 0.65s; }

  @keyframes swing-in {
    from { opacity: 0; transform: translateY(-10px) rotate(-3deg); }
    to { opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  .tag-string {
    width: 1px;
    height: 22px;
    background: var(--steel-line);
  }

  .tag-hook {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 2px solid var(--steel-line);
    margin-bottom: -1px;
  }

  .tag-card {
    width: 148px;
    padding: 26px 18px 20px;
    background: linear-gradient(180deg, #23283380 0%, #1B1F2780 100%);
    border: 1px solid var(--steel-line);
    border-radius: 6px;
    text-align: center;
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }

  .tag-card svg { display: block; margin: 0 auto 14px; }

  .tag:hover .tag-card {
    transform: translateY(-4px);
    border-color: var(--brass);
    background: linear-gradient(180deg, #262C39 0%, #1E232D 100%);
  }
  .tag:hover .tag-string { background: var(--brass); }

  .tag-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--paper);
    letter-spacing: 0.01em;
  }

  .tag-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin-top: 5px;
  }

  @media (max-width: 560px) {
    .tags { gap: 26px; margin-top: 36px; }
    .tag-card { width: 130px; padding: 20px 12px 16px; }
  }

  .contact {
    position: relative;
    z-index: 2;
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--paper-dim);
    animation: rise 1s cubic-bezier(.19,1,.22,1) 0.7s both;
  }

  .contact a {
    color: var(--brass);
    text-decoration: none;
    border-bottom: 1px solid rgba(201,161,90,0.35);
    transition: color 0.2s ease, border-color 0.2s ease;
  }

  .contact a:hover {
    color: var(--brass-bright);
    border-color: var(--brass-bright);
  }

  .visit-counter {
    position: relative;
    z-index: 2;
    display: block;
    margin-top: 16px;
    opacity: 0.55;
    transition: opacity 0.2s ease;
  }

  .visit-counter:hover {
    opacity: 0.9;
  }

  .visit-counter img {
    display: block;
    border-radius: 3px;
  }
</style>
</head>
<body>

  <div class="pegboard" id="pegboard"></div>

  <div class="plate-wrap">
    <div class="sweep"></div>
    <span class="screw tl"></span>
    <span class="screw tr"></span>
    <span class="screw bl"></span>
    <span class="screw br"></span>

    <p class="eyebrow">Est. 2026 — Cambridge, ON</p>
    <h1>The Workshop</h1>
    <p class="tagline">Small tools, built by hand for the people who need them. Ask, and I'll hand you the key.</p>
    <div class="divider"></div>
    <div class="status"><span class="dot"></span>Lights are on</div>
  </div>

  <div class="tags">
    <a class="tag" href="https://homework.bellstuff.net" target="_blank" rel="noopener">
      <div class="tag-hook"></div>
      <div class="tag-string"></div>
      <div class="tag-card">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 11L20 6L34 11L20 16L6 11Z" stroke="#C9A15A" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 14.5V23C12 23 14.5 26 20 26C25.5 26 28 23 28 23V14.5" stroke="#C9A15A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M33 12V21" stroke="#E9E5DA" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="33" cy="24" r="1.4" fill="#8A3B2E"/>
        </svg>
        <div class="tag-label">Homework</div>
        <div class="tag-sub">practice bench</div>
      </div>
    </a>

    <a class="tag" href="https://homework.bellstuff.net/english/" target="_blank" rel="noopener">
      <div class="tag-hook"></div>
      <div class="tag-string"></div>
      <div class="tag-card">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M8 10H18C20 10 21 11 21 13V31C21 29 19 28 17 28H8V10Z" stroke="#C9A15A" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M32 10H24C22 10 21 11 21 13V31C21 29 23 28 25 28H32V10Z" stroke="#E9E5DA" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M11 16H17M11 20H17M25 16H29M25 20H29" stroke="#C9A15A" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <div class="tag-label">English</div>
        <div class="tag-sub">reading &amp; writing</div>
      </div>
    </a>

    <a class="tag" href="https://chores.bellstuff.net" target="_blank" rel="noopener">
      <div class="tag-hook"></div>
      <div class="tag-string"></div>
      <div class="tag-card">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 5L32 10.5V20.2C32 27.4 27 32.4 20 35C13 32.4 8 27.4 8 20.2V10.5L20 5Z" stroke="#C9A15A" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M14.5 19.5L18.3 23.5L26 15" stroke="#E9E5DA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="tag-label">Chore Quest</div>
        <div class="tag-sub">family missions</div>
      </div>
    </a>
  </div>

  <p class="contact">Interested in one of these? <a href="mailto:bell.ryan@gmail.com">bell.ryan@gmail.com</a></p>

  <a class="visit-counter" href="https://hits.sh/bellstuff.net/" target="_blank" rel="noopener">
    <img src="https://hits.sh/bellstuff.net.svg?style=flat-square&label=visits&color=1e222b&labelColor=14171d&extraCount=0" alt="visit count" />
  </a>

  <div class="corner-mark">// no public entrance</div>

<script>
  // Scatter a handful of ambient peg-lights across the board, avoiding the center plate.
  const board = document.getElementById('pegboard');
  const count = 9;
  for (let i = 0; i < count; i++) {
    const light = document.createElement('div');
    light.className = 'peg-light' + (Math.random() < 0.3 ? ' ember' : '');
    const angle = Math.random() * Math.PI * 2;
    const radius = 30 + Math.random() * 62; // percent-ish spread, kept off-center
    const x = 50 + Math.cos(angle) * radius;
    const y = 50 + Math.sin(angle) * radius;
    light.style.left = Math.min(96, Math.max(2, x)) + 'vw';
    light.style.top = Math.min(94, Math.max(4, y)) + 'vh';
    light.style.animationDelay = (Math.random() * 5) + 's';
    board.appendChild(light);
  }
</script>

</body>
</html>
